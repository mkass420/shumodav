[tool.poetry]
name = "shumodav"
version = "2.0.0"
description = "Сравнение методов шумоподавления изображений"
authors = ["mkass420"]
readme = "README.md"
packages = [{include = "shumodav", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.26"
scipy = ">=1.13"
opencv-python = ">=4.9"
pywavelets = ">=1.6"
scikit-image = ">=0.22"
matplotlib = ">=3.8"
pandas = ">=2.1"
tqdm = ">=4.66"
pyqt5 = ">=5.15"
torch = {version = ">=2.2", optional = true}
bm3d = {version = ">=4.0", optional = true}

[tool.poetry.extras]
neural = ["torch"]
bm3d = ["bm3d"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: тяжёлые проверки (прогон всех методов в GUI)"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
